[package]
name = "hyperborea-grid"
version = "0.1.0"
edition = "2021"
authors = ["ZengLLQ"]
description = "Rotated Planar Surface Code Stabilizer Measurement, Pauli Noise Models & Minimum-Weight Perfect Matching Blossom Decoder in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ZengLLQ/hyperborea-grid"
keywords = ["quantum-computing", "surface-code", "error-correction", "mwpm-decoder", "blossom-algorithm"]
categories = ["science", "simulation", "algorithms"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"

[[bin]]
name = "hyperborea-grid"
path = "src/main.rs"

[lib]
name = "hyperborea_grid"
path = "src/lib.rs"
